<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    body{ font-family: Arial; padding:20px; }
    img{ width:200px; cursor:pointer; }
    </style>
    <script>
    function validatePhone(){
        let phone=document.getElementById("phone").value;
        if(phone.length!=10 || isNaN(phone)){
            alert("Enter a valid 10-digit phone number");
        }
    }

    function showFee(){
        let event=document.getElementById("event").value;
        let fee="";
        if(event=="Workshop")
            fee="₹500";
        else if(event=="Seminar")
            fee="₹300";
        else if(event=="Conference")
            fee="₹1000";
        document.getElementById("fee").innerHTML="Fee: "+fee;
    }
    function submitForm(){
        alert("Feedback Submitted Successfully!");
    }
    function enlarge(img){
        img.style.width="400px";
    }
    function countChars(){
        let count=document.getElementById("feedback").value.length;
        document.getElementById("count").innerHTML=count;
    }
    </script>
</head>
<body>
    Phone:<input type="text" id="phone" onblur="validatePhone()"><br><br>
    Event:
    <select id="event" onchange="showFee()">
        <option>Select</option>
        <option>Workshop</option>
        <option>Seminar</option>
        <option>Conference</option>
    </select>
    <p id="fee"></p>
    <textarea id="feedback" rows="5" cols="30" onkeyup="countChars()"></textarea>
    <p>Characters: <span id="count">0</span></p>
    <img src="event.jpg" ondblclick="enlarge(this)"><br><br>
    <button onclick="submitForm()">Submit</button>
</body>
</html>
